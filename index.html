<title>楊琦如｜履歷</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family:
            "Noto Sans TC",
            "Microsoft JhengHei",
            Arial,
            sans-serif;
        background: #f5f7fa;
        color: #263238;
        line-height: 1.8;
    }

    /* ===== 導覽列 ===== */

    nav {
        position: sticky;
        top: 0;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.95);
        border-bottom: 1px solid #e5e7eb;
        backdrop-filter: blur(10px);
    }

    .nav-container {
        max-width: 1100px;
        margin: auto;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 20px;
        font-weight: 700;
        color: #1e3a5f;
    }

    .nav-links {
        display: flex;
        gap: 24px;
        list-style: none;
    }

    .nav-links a {
        text-decoration: none;
        color: #4b5563;
        font-size: 14px;
        transition: 0.2s;
    }

    .nav-links a:hover {
        color: #2563eb;
    }

    /* ===== 首頁 ===== */

    .hero {
        background: linear-gradient(
            135deg,
            #eaf2ff,
            #f8fafc
        );

        padding: 110px 24px 100px;
    }

    .hero-container {
        max-width: 1100px;
        margin: auto;
    }

    .hero h1 {
        font-size: 52px;
        color: #172b4d;
        margin-bottom: 10px;
    }

    .hero h2 {
        font-size: 22px;
        font-weight: 400;
        color: #52616b;
        margin-bottom: 24px;
    }

    .hero p {
        max-width: 720px;
        color: #5f6b76;
        font-size: 17px;
    }

    .tags {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    .tag {
        background: white;
        color: #2563eb;
        border: 1px solid #dbeafe;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 14px;
    }

    /* ===== 共用區塊 ===== */

    section {
        max-width: 1100px;
        margin: auto;
        padding: 85px 24px;
    }

    .section-title {
        font-size: 30px;
        color: #172b4d;
        margin-bottom: 12px;
    }

    .section-subtitle {
        color: #7b8794;
        margin-bottom: 40px;
    }

    /* ===== 關於我 ===== */

    .about-card {
        background: white;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
    }

    /* ===== 技能 ===== */

    .skills {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .skill-card {
        background: white;
        padding: 28px;
        border-radius: 16px;
        border: 1px solid #edf0f4;
        transition: 0.25s;
    }

    .skill-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    .skill-card h3 {
        color: #1e3a5f;
        margin-bottom: 8px;
    }

    .skill-card p {
        color: #68737d;
        font-size: 15px;
    }

    /* ===== 專案 ===== */

    .projects {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 28px;
    }

    .project-card {
        background: white;
        padding: 35px;
        border-radius: 18px;
        border: 1px solid #e8edf3;
        transition: 0.25s;
    }

    .project-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 15px 35px rgba(15, 23, 42, 0.1);
    }

    .project-number {
        color: #2563eb;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 12px;
    }

    .project-card h3 {
        font-size: 22px;
        color: #172b4d;
        margin-bottom: 15px;
    }

    .project-card p {
        color: #5f6b76;
        margin-bottom: 20px;
    }

    .tech-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .tech {
        background: #eff6ff;
        color: #2563eb;
        padding: 5px 11px;
        border-radius: 15px;
        font-size: 13px;
    }

    /* ===== 學歷 ===== */

    .education-card {
        background: white;
        padding: 35px;
        border-left: 5px solid #2563eb;
        border-radius: 12px;
        box-shadow: 0 8px 25px rgba(15, 23, 42, 0.05);
    }

    .education-card h3 {
        font-size: 22px;
        color: #172b4d;
    }

    .education-card p {
        color: #68737d;
    }


```

</body>
</html>
